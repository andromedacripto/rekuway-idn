openapi: 3.0.3
info:
  title: Rekuway IDN API
  version: 2.1.0
  description: |
    Identidades temporárias com defesa ativa (ALLOW, REGENERATE, LIE, KILL), bloqueio de sessão
    com MFA e deadman switch.

    **Respostas uniformes.** Por design, qualquer falha (credencial inválida, identidade
    inexistente ou destruída, limite excedido, JSON inválido) devolve o mesmo corpo `Stealth`
    com HTTP 200. Só quem apresenta uma credencial válida recebe detalhes (`STEP_UP_REQUIRED`,
    `BLOCKED`). Não use o código HTTP para decidir sucesso: leia o corpo.
servers:
  - url: https://rekuway-idn-mvp.vercel.app
    description: Produção (ajuste para o seu ambiente)
tags:
  - name: Identidade
  - name: Administração
  - name: Agentes
components:
  parameters:
    EndUserIp:
      name: x-end-user-ip
      in: header
      required: false
      description: IP do usuário final. Só é considerado com uma chave de API válida em `Authorization`; sem ela é ignorado.
      schema: { type: string, example: 203.0.113.7 }
    EndUserUserAgent:
      name: x-end-user-user-agent
      in: header
      required: false
      description: Navegador do usuário final (até 256 caracteres). Mesma regra do IP.
      schema: { type: string }
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Chave `rkwy_live_…`. Aceita somente no header Authorization.
    internalSecret:
      type: apiKey
      in: header
      name: x-internal-secret
      description: Segredo compartilhado com o dashboard (INTERNAL_SECRET).
  schemas:
    ParanoiaLevel:
      type: string
      enum: [low, medium, high, deadman]
    Stealth:
      type: object
      description: Resposta uniforme para qualquer falha.
      properties:
        success: { type: boolean, example: true }
        status: { type: string, example: ok }
        mode: { type: string, example: stealth }
    Identity:
      type: object
      properties:
        id: { type: string, format: uuid }
        publicKey: { type: string }
        paranoiaLevel: { $ref: '#/components/schemas/ParanoiaLevel' }
        expiresAt: { type: integer, format: int64, description: 'Epoch em ms' }
    Mfa:
      type: object
      description: Exibido uma única vez, na criação (níveis medium, high e deadman).
      properties:
        secret: { type: string, description: 'TOTP em base32' }
        otpauthUri: { type: string }
    Credentials:
      oneOf:
        - type: object
          required: [token]
          properties:
            token: { type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]+$' }
        - type: object
          required: [identityId, privateKey]
          properties:
            identityId: { type: string, format: uuid }
            privateKey: { type: string }
    CheckAllowed:
      type: object
      properties:
        success: { type: boolean }
        action: { type: string, enum: [ALLOWED] }
        token: { type: string, description: 'Token rotacionado; use-o na próxima chamada' }
        identity: { $ref: '#/components/schemas/Identity' }
    StepUpRequired:
      type: object
      properties:
        success: { type: boolean }
        action: { type: string, enum: [STEP_UP_REQUIRED] }
        reason: { type: string, example: risk_detected }
        challengeId: { type: string, format: uuid }
        methods:
          type: array
          items: { type: string, enum: [reauth, mfa] }
        endpoint: { type: string, example: /identity/step-up }
    Blocked:
      type: object
      properties:
        success: { type: boolean }
        action: { type: string, enum: [BLOCKED] }
        retryAfter: { type: integer, description: 'Segundos' }
paths:
  /identity/new:
    post:
      tags: [Identidade]
      summary: Cria uma identidade
      security: [{ apiKey: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paranoiaLevel: { $ref: '#/components/schemas/ParanoiaLevel' }
                externalRef:
                  type: string
                  maxLength: 64
                  pattern: '^[A-Za-z0-9._@-]+$'
                  description: 'Código opaco da pessoa, como a matrícula. Não use nome, e-mail nem CPF.'
      responses:
        '200':
          description: Criada (`status` = created) ou resposta uniforme.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success: { type: boolean }
                      status: { type: string, enum: [created] }
                      token: { type: string }
                      expiresAt: { type: integer, format: int64 }
                      mfa: { $ref: '#/components/schemas/Mfa' }
                  - $ref: '#/components/schemas/Stealth'
  /identity/people/revoke:
    post:
      tags: [Identidade]
      summary: Revoga todas as identidades vivas de uma pessoa (desligamento)
      description: |
        Destrói as identidades da pessoa que pertencem à empresa dona da chave de API.
        Encerra as sessões da Rekuway; não bloqueia contas em outros sistemas.
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalRef]
              properties:
                externalRef: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9._@-]+$' }
      responses:
        '200':
          description: Quantas identidades foram destruídas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  revoked: { type: integer }
        '400': { description: Requisição inválida }
  /identity/check:
    post:
      parameters:
        - $ref: '#/components/parameters/EndUserIp'
        - $ref: '#/components/parameters/EndUserUserAgent'
      tags: [Identidade]
      summary: Valida a credencial e aplica o motor de defesa
      description: |
        Com credencial válida, o motor pontua o risco do uso. Acima do limite do nível, a sessão é
        travada (`STEP_UP_REQUIRED`). Credencial inválida alimenta ALLOW, REGENERATE, LIE e KILL e
        sempre devolve a resposta uniforme.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CheckAllowed'
                  - $ref: '#/components/schemas/StepUpRequired'
                  - $ref: '#/components/schemas/Blocked'
                  - $ref: '#/components/schemas/Stealth'
  /identity/step-up:
    post:
      parameters:
        - $ref: '#/components/parameters/EndUserIp'
        - $ref: '#/components/parameters/EndUserUserAgent'
      tags: [Identidade]
      summary: Reautentica e destrava uma sessão travada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Credentials'
                - type: object
                  required: [challengeId]
                  properties:
                    challengeId: { type: string, format: uuid }
                    code: { type: string, pattern: '^\d{6}$', description: 'Código TOTP' }
      responses:
        '200':
          description: Destravada, falha com tentativas restantes, bloqueada, ou resposta uniforme.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CheckAllowed'
                  - type: object
                    properties:
                      action: { type: string, enum: [STEP_UP_FAILED] }
                      remainingAttempts: { type: integer }
                  - $ref: '#/components/schemas/Blocked'
                  - $ref: '#/components/schemas/Stealth'
  /identity/heartbeat:
    post:
      parameters:
        - $ref: '#/components/parameters/EndUserIp'
        - $ref: '#/components/parameters/EndUserUserAgent'
      tags: [Identidade]
      summary: Renova o prazo de uma identidade deadman
      description: Recusado (resposta uniforme) se a sessão estiver travada. Identidades usadas só por token renovam o prazo a cada `/identity/check`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityId, privateKey]
              properties:
                identityId: { type: string, format: uuid }
                privateKey: { type: string }
      responses:
        '200': { description: 'Sucesso (`identity` presente) ou resposta uniforme' }
  /identity/regenerate:
    post:
      parameters:
        - $ref: '#/components/parameters/EndUserIp'
        - $ref: '#/components/parameters/EndUserUserAgent'
      tags: [Identidade]
      summary: Troca a identidade por uma nova
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityId, privateKey]
              properties:
                identityId: { type: string, format: uuid }
                privateKey: { type: string }
      responses:
        '200': { description: 'Credencial nova (`token`, `exp`, `lvl`) ou resposta uniforme' }
  /identity/kill:
    post:
      parameters:
        - $ref: '#/components/parameters/EndUserIp'
        - $ref: '#/components/parameters/EndUserUserAgent'
      tags: [Identidade]
      summary: Destrói a identidade (sempre permitido a quem tem a chave)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityId, privateKey]
              properties:
                identityId: { type: string, format: uuid }
                privateKey: { type: string }
      responses:
        '200': { description: '`{ "success": true }` ou resposta uniforme' }
  /api-keys:
    post:
      tags: [Administração]
      summary: Cria uma chave de API
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, name]
              properties:
                userId: { type: string }
                name: { type: string }
                tier: { type: string, enum: [hobby, startup, business, enterprise] }
      responses:
        '201': { description: 'Criada; a chave completa aparece uma única vez' }
        '401': { description: 'Segredo ausente ou inválido' }
  /api-keys/{userId}:
    get:
      tags: [Administração]
      summary: Lista as chaves (mascaradas) de um usuário
      security: [{ internalSecret: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Lista' }
        '401': { description: 'Não autorizado' }
  /api-keys/{hashedKey}:
    delete:
      tags: [Administração]
      summary: Revoga uma chave
      security: [{ internalSecret: [] }]
      parameters:
        - { name: hashedKey, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Revogada' }
        '404': { description: 'Não encontrada' }
  /internal/identities/{id}/unlock:
    post:
      tags: [Administração]
      summary: Suporte libera uma sessão travada ou bloqueada
      security: [{ internalSecret: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Liberada' }
        '401': { description: 'Não autorizado' }
  /internal/deadman-sweep:
    get:
      tags: [Administração]
      summary: Varredura do deadman para ambientes serverless
      description: Aceita `x-internal-secret` ou `Authorization Bearer CRON_SECRET`.
      security: [{ internalSecret: [] }]
      responses:
        '200': { description: '`{ checked, killed }`' }
        '401': { description: 'Não autorizado' }
  /agents/approvers:
    post:
      tags: [Agentes]
      summary: Cadastra quem aprova acessos (gera o MFA dele)
      description: |
        Rotas `/agents` são chamadas pelo servidor do cliente com a chave de API. Diferente das rotas
        de identidade, os erros são explícitos: `{ ok:false, error:{ code, message } }` com HTTP coerente.
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approverId]
              properties:
                approverId: { type: string, pattern: '^[A-Za-z0-9_.@-]{1,64}$' }
      responses:
        '201': { description: 'Criado. `mfa.secret` e `mfa.otpauthUri` aparecem uma única vez.' }
        '409': { description: Já existe }
  /agents/access-requests:
    post:
      tags: [Agentes]
      summary: O agente (ou a plataforma dele) pede acesso
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, approverId, scopes]
              properties:
                agentId: { type: string }
                approverId: { type: string }
                scopes:
                  type: array
                  maxItems: 20
                  items: { type: string, example: 'db:read' }
                  description: 'recurso:ação; curinga só no final (`db:*`). Um `*` sozinho não existe.'
                sensitiveScopes:
                  type: array
                  items: { type: string }
                  description: Subconjunto de `scopes` que exige aprovação humana a cada uso.
                ttlSeconds: { type: integer, minimum: 60, maximum: 86400, default: 3600 }
                maxUses: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 200 }
      responses:
        '201': { description: 'Pedido pendente (vale 10 minutos).' }
        '400': { description: Pedido inválido }
        '404': { description: Aprovador inexistente }
  /agents/access-requests/{id}:
    get:
      tags: [Agentes]
      summary: Estado do pedido (pending, approved, denied)
      security: [{ apiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Estado }
        '404': { description: Não encontrado ou expirado }
  /agents/access-requests/{id}/approve:
    post:
      tags: [Agentes]
      summary: O humano aprova com o código do celular e o token do agente é emitido
      security: [{ apiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          {
            description: 'Aprovado. O `token` (`agt_…`) aparece uma única vez; só o hash dele é guardado.',
          }
        '403': { description: Código inválido ou já usado }
        '409': { description: Pedido já decidido }
        '429': { description: Aprovador travado por códigos errados }
  /agents/access-requests/{id}/deny:
    post:
      tags: [Agentes]
      summary: Nega o pedido
      security: [{ apiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Negado }
  /agents/verify:
    post:
      tags: [Agentes]
      summary: O agente pode fazer esta ação agora?
      description: |
        Chamado pelo servidor do cliente a cada uso do agente. O token é estável (não troca a cada uso),
        então chamadas em paralelo funcionam. "Negado" não é erro HTTP: vem como `allowed:false` + `reason`
        (`invalid_token`, `expired`, `revoked`, `scope_denied`, `rate_limited`, `limit_reached`,
        `approval_required`, `approval_pending`, `approval_invalid`, `unavailable`).
        Ação sensível sem aprovação devolve `approval_required` com um `approvalId`.
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, action]
              properties:
                token: { type: string }
                action: { type: string, example: 'db:write' }
                approvalId: { type: string, format: uuid }
      responses:
        '200': { description: 'Resultado: `{ ok:true, allowed, ... }`' }
  /agents/approvals/{id}/approve:
    post:
      tags: [Agentes]
      summary: O humano aprova uma ação sensível com o código do celular
      security: [{ apiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          {
            description: 'Aprovada. Vale uma única chamada de `/agents/verify` e expira em 5 minutos.',
          }
        '403': { description: Código inválido }
  /agents/grants/{id}:
    get:
      tags: [Agentes]
      summary: Estado do acesso concedido (active, expired, revoked)
      security: [{ apiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Resumo (nunca inclui o token) }
        '404': { description: Não encontrado }
  /agents/grants/{id}/audit:
    get:
      tags: [Agentes]
      summary: Últimos usos (permitidos e negados) do acesso
      security: [{ apiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200': { description: 'Entradas, da mais nova para a mais antiga' }
  /agents/grants/{id}/revoke:
    post:
      tags: [Agentes]
      summary: Botão de pânico, o acesso acaba na hora
      security: [{ apiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Revogado }
  /health:
    get:
      summary: Liveness
      responses:
        '200': { description: 'ok' }
